<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海洋采样同步</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:1050px;margin:32px auto;padding:0 18px}input,select,textarea,button{padding:7px;margin:3px}.card{border:1px solid #d9e1e8;border-radius:10px;padding:16px;margin:16px 0}pre,textarea{background:#f5f7f9;padding:12px;overflow:auto;width:100%;box-sizing:border-box}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}small{color:#667}.ok{color:#18794e}.bad{color:#b42318}</style></head>
<body><h1>海洋科考采样与岸端同步</h1><p>将离线设备的一批站位、样本、交接和仪器文件提交到服务。本地 UUID 重复提交会幂等处理，冲突会进入隔离清单。</p>
<div class="card"><h2>身份</h2><input id="user" value="member-a"><select id="role"><option>member</option><option>lead</option><option>editor</option></select><button onclick="refresh()">刷新全部</button> <label>航次 ID <input id="voyage" type="number" value="1"></label></div>
<div class="card"><h2>离线批次 JSON</h2><textarea id="batch" rows="16">{"device_id":"tablet-A","records":[{"type":"station","local_uuid":"st-001","revision":1,"data":{"voyage_id":1,"station_code":"S-01","latitude":30.1,"longitude":122.0,"sampled_at":"2026-09-05T08:30:00+08:00","owner":"member-a"}},{"type":"sample","local_uuid":"sample-001","revision":1,"data":{"station_id":1,"sample_code":"W-001","sample_type":"water","depth_m":5,"storage_condition":"4C","owner":"member-a"}}]}</textarea><button onclick="syncBatch()">同步批次</button><pre id="syncResult">等待同步…</pre></div>
<div class="card"><h2>站位封存（岸端归档）</h2><p><small>每个站位保留一个待办包；样本未确认、缺少保管交接或仪器文件未关联本站位时会列出缺项并阻止封存。封存冻结清单与文件哈希，之后补传的文件进入下一版，旧包仍可查询。</small></p>
<label>站位 ID <input id="archStation" type="number" value="1"></label>
<button onclick="loadArchive()">检查缺项</button>
<button id="sealBtn" onclick="sealStation()">封存待办包</button>
<button onclick="listArchives()">历史封存包</button>
<div id="archiveStatus"></div>
<pre id="archiveResult">尚未检查…</pre></div>
<div class="card"><h2>数据与冲突</h2><pre id="data">等待刷新…</pre></div>
<script>
const auth=()=>({'Content-Type':'application/json','X-User':user.value,'X-Role':role.value});
async function call(url,opts={}){const r=await fetch(url,opts);const j=await r.json();if(!r.ok){const e=Error(j.error||r.status);e.details=j.details;throw e}return j}
async function syncBatch(){try{syncResult.textContent=JSON.stringify(await call('/api/sync',{method:'POST',headers:auth(),body:batch.value}),null,2);refresh()}catch(e){syncResult.textContent=e.message}}
function showMissing(items){archiveStatus.innerHTML='';const p=document.createElement('p');p.className='bad';p.textContent='✘ 封存被阻止，缺项：';archiveStatus.appendChild(p);const ul=document.createElement('ul');items.forEach(m=>{const li=document.createElement('li');li.textContent=m.message;ul.appendChild(li)});archiveStatus.appendChild(ul)}
async function loadArchive(){try{const j=await call('/api/archive/station/'+archStation.value);const r=j.readiness;sealBtn.disabled=!r.ready;if(r.ready){archiveStatus.innerHTML='';const p=document.createElement('p');p.className='ok';p.textContent='✔ 第 '+j.package.version+' 版待办包可以封存';archiveStatus.appendChild(p)}else{showMissing(r.missing)}archiveResult.textContent=JSON.stringify(j,null,2)}catch(e){archiveStatus.textContent=e.message}}
async function sealStation(){try{const j=await call('/api/archive/station/'+archStation.value+'/seal',{method:'POST',headers:auth(),body:'{}'});archiveResult.textContent=JSON.stringify(j,null,2);await loadArchive()}catch(e){if(e.details&&e.details.missing)showMissing(e.details.missing);archiveResult.textContent=e.message}}
async function listArchives(){try{archiveResult.textContent=JSON.stringify(await call('/api/archives?station_id='+archStation.value),null,2)}catch(e){archiveResult.textContent=e.message}}
async function refresh(){try{const [stations,samples,conflicts,files,custody,archives]=await Promise.all(['/api/stations','/api/samples','/api/conflicts','/api/instrument-files','/api/custody','/api/archives'].map(u=>call(u)));data.textContent=JSON.stringify({stations,samples,conflicts,files,custody,archives},null,2)}catch(e){data.textContent=e.message}}
</script></body></html>
